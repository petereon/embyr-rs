name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── test: run the full workspace test suite against a real Postgres ──────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: embyr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/embyr_test
      EMBYR_ADMIN_KEY: ci-admin-key
      EMBYR_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20
      # card_payments_backend's own tests (D-13) require real Stripe
      # test-mode API access — no mocking, matching this codebase's
      # real-I/O testing convention elsewhere. Must be a `sk_test_...` key
      # from a real (test-mode) Stripe account, added as a repo secret:
      # `gh secret set STRIPE_SECRET_KEY`. Empty/unset in a fork or before
      # that secret exists — those 4 tests fail with a clear "not an
      # acceptable RED reason" panic rather than a silent skip.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # This workspace now builds ~38 separate integration test binaries
      # (grown well past the "6+" this file's own disk-space comment below
      # was written for), each statically linking its own copy of every
      # dependency. Even after the disk-space cleanup step, a full run has
      # started hitting "No space left on device" mid-compile (LLVM IO
      # errors, `ld` Bus errors from truncated mmap'd output — both are the
      # SAME root cause, not two different bugs). Full debug info
      # (`-C debuginfo=2`, rustc's default for the test profile) is by far
      # the largest share of that footprint. `line-tables-only` keeps
      # file:line info for panic backtraces while dropping the much larger
      # variable/type debug data test binaries don't need in CI (only
      # local interactive debugging with lldb/gdb benefits from full
      # debuginfo=2, which local `cargo test` — unaffected by this CI-only
      # env var — still gets).
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v4

      # cargo test --workspace builds 7 crates + ~38 separate integration
      # test binaries with debug symbols, which reliably exceeds the
      # ~14 GB free on a stock ubuntu-latest runner. Removing unused
      # preinstalled SDKs frees ~30-40 GB before the build starts.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # toolchain: pinned explicitly to match rust-toolchain.toml's own
      # "1.95.0" pin exactly — without this, the action installs whatever
      # "stable" currently resolves to, and rustup tracks that as a
      # SEPARATE toolchain install from "1.95.0". Any targets/components
      # requested here land on "stable"; the moment any cargo/rustc/trunk
      # command actually runs from inside the repo, rust-toolchain.toml's
      # own override silently switches to "1.95.0", which never received
      # them. (Keep the action ref itself at @stable — that pins the
      # ACTION's own code version, unrelated to which Rust channel it
      # installs; the `toolchain:` input below controls that.)
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # tests/user_admin_ui's walking skeleton (admin_spa_http_probe) serves
      # this dist/ directory via ServeDir and is NOT #[ignore] — it needs the
      # real trunk-built SPA output to exist before cargo test runs.
      - name: Build admin SPA (trunk)
        run: trunk build --release
        working-directory: crates/embyr-admin-ui

      - name: Run workspace tests
        run: cargo test --workspace

  # ─── lint: clippy -D warnings ──────────────────────────────────────────────
  # cargo-deny check moved to its own workflow (cargo-deny.yml) — see that
  # file's header comment for why (finding #23: needs a `schedule:` trigger
  # too, which this push/pull_request-only workflow can't add without
  # scheduling the full test/lint/docker/agent job graph daily).
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # toolchain: pinned to match rust-toolchain.toml exactly — see the
      # comment on the equivalent step in the `test` job above for why.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy — deny all warnings
        run: cargo clippy --workspace -- -D warnings

  # ─── docker: build the container image (validates Dockerfile) ────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GitHub-hosted runners are ephemeral — cargo-chef's dependency-layer
      # caching inside the Dockerfile only helps within a single build; without
      # an external cache backend every run rebuilds the entire dependency
      # layer from scratch. --cache-to/--cache-from type=gha persists layers
      # in GitHub's Actions cache across runs, so unchanged Cargo.toml/lock
      # layers are reused instead of recompiling every dependency every time.
      - name: Build Docker image
        run: >
          docker build . -t embyr-server:ci
          --cache-from type=gha
          --cache-to type=gha,mode=max

  # ─── agent: build + verify + package the embyr-agent static binary ───────────
  # Produces the artifact ADR-001 requires: a separately compiled,
  # statically-linked embyr-agent binary. Deliberately has no `needs:` —
  # see ADR-074 for why mirroring the `docker` job's `needs: [test]` shape
  # would break AC-EARP-05's failure-visibility requirement.
  agent:
    name: Agent build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc + musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools

      # toolchain: pinned to match rust-toolchain.toml exactly (1.95.0) — see
      # the equivalent comment in the `test` job for why drift here has
      # broken CI before. `targets:` installs the musl target on THIS
      # pinned toolchain install, not via a later `rustup target add` (which
      # would silently land on the wrong, stable-tracking toolchain once
      # rust-toolchain.toml's own override takes effect).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # Compiles the release embyr-agent binary for the musl target AND runs
      # the three acceptance tests already written for exactly this purpose
      # (tests/acceptance/embyr_agent/us_a06_lifecycle.rs) against the real
      # compiled artifact — the happy-path startup-ordering and credential-
      # logging proofs, AND the fail-closed-on-unreachable-storage proof
      # (AC-EARP-02 covers both the artifact working AND failing correctly).
      # RUSTFLAGS makes static linking explicit on top of musl's own default
      # (matches main.rs's own top comment and
      # docs/architecture/embyr-rs/architecture-decisions.md:147).
      - name: Build + verify release musl binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: >
          cargo test --release --target x86_64-unknown-linux-musl
          -p embyr-agent --test embyr_agent --
          agent_logs_storage_readiness_before_accepting_connections
          storage_credential_never_appears_in_agent_logs
          agent_exits_without_binding_port_when_storage_unreachable

      - name: Upload embyr-agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: embyr-agent-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/embyr-agent
          if-no-files-found: error

      - uses: docker/setup-buildx-action@v3

      # Validates crates/embyr-agent/Dockerfile builds — build-and-tag-only,
      # no registry push, same pattern the existing `docker` job already
      # uses for embyr-server (registry publishing is finding #19's scope).
      # scope=agent keeps this job's GHA cache isolated from the existing
      # `docker` job's own cache (AC-EARP-04: no shared state).
      - name: Build embyr-agent container image
        run: >
          docker build . -f crates/embyr-agent/Dockerfile -t embyr-agent:ci
          --cache-from type=gha,scope=agent
          --cache-to type=gha,mode=max,scope=agent
