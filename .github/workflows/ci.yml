name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── test: run the full workspace test suite against a real Postgres ──────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: embyr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/embyr_test
      EMBYR_ADMIN_KEY: ci-admin-key
      EMBYR_ENCRYPTION_KEY: 0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20

    steps:
      - uses: actions/checkout@v4

      # cargo test --workspace builds 7 crates + 6+ separate integration test
      # binaries with debug symbols, which reliably exceeds the ~14 GB free
      # on a stock ubuntu-latest runner. Removing unused preinstalled SDKs
      # frees ~30-40 GB before the build starts.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # tests/user_admin_ui's walking skeleton (admin_spa_http_probe) serves
      # this dist/ directory via ServeDir and is NOT #[ignore] — it needs the
      # real trunk-built SPA output to exist before cargo test runs.
      - name: Build admin SPA (trunk)
        run: trunk build --release
        working-directory: crates/embyr-admin-ui

      - name: Run workspace tests
        run: cargo test --workspace

  # ─── lint: clippy -D warnings + cargo deny check ─────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy — deny all warnings
        run: cargo clippy --workspace -- -D warnings

      # EmbarkStudios/cargo-deny-action@v1 runs its own bundled/containerized
      # cargo, isolated from the dtolnay/rust-toolchain step above — that
      # bundled toolchain can't parse this workspace's Cargo.lock (v4 format).
      # Installing cargo-deny directly reuses the already-provisioned modern
      # toolchain instead, consistent with how clippy/tests already run.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  # ─── docker: build the container image (validates Dockerfile) ────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t embyr-server:ci .
