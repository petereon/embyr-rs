schema_version: 1

journey:
  name: "Secrets Lifecycle — Sourcing and Rotation"
  goal: >
    Source EMBYR_ADMIN_KEY and EMBYR_ENCRYPTION_KEY from AWS/GCP Secrets Manager at startup,
    and rotate either secret in production without an outage or permanently orphaned data.
  persona: "Sam Chen (P2 — Service Operator / Platform Engineer), JOB-14"

  emotional_arc:
    start: "Anxious — one leak away from a coordinated flag-day outage; no rotation path exists"
    middle: "Focused / cautious — watching logs and client behavior during the rotation window"
    end: "Confident / in control — rotation was routine, nothing broke, nothing was orphaned"

steps:
  - id: 1
    name: "Configure secrets-manager sourcing"
    command: "kubectl apply -f embyr-server-deployment.yaml"

    tui_mockup: |
      +-- Step 1: Configure secrets-manager sourcing -------------------+
      | env:                                                            |
      |   - name: EMBYR_ADMIN_KEY_AWS_SECRET_ARN                       |
      |     value: arn:...:secret:${admin_secret_ref}                  |
      |   - name: EMBYR_ENCRYPTION_KEY_AWS_SECRET_ARN                  |
      |     value: arn:...:secret:${encryption_secret_ref}             |
      | deployment.apps/embyr-server configured                        |
      +------------------------------------------------------------------+

    shared_artifacts:
      - name: "admin_secret_ref"
        source: "EMBYR_ADMIN_KEY_AWS_SECRET_ARN or EMBYR_ADMIN_KEY_GCP_SECRET_NAME (deployment manifest)"
        displayed_as: "${admin_secret_ref}"
        consumers: ["startup log line", "IAM/access-policy audit"]
      - name: "encryption_secret_ref"
        source: "EMBYR_ENCRYPTION_KEY_AWS_SECRET_ARN or EMBYR_ENCRYPTION_KEY_GCP_SECRET_NAME (deployment manifest)"
        displayed_as: "${encryption_secret_ref}"
        consumers: ["startup log line", "IAM/access-policy audit"]

    emotional_state:
      entry: "Anxious — is the manifest actually free of literal secrets now?"
      exit: "Cautious relief — manifest review confirms zero literal key values"

    integration_checkpoint: |
      Exactly one admin-key source (plain var OR AWS ref OR GCP ref) is configured, and
      exactly one encryption-key source. Two or more sources for the same key is a config
      error caught before any I/O (see US-SM-01, US-SM-02 AC).

    failure_modes:
      - "Both a plain env var and a secret-ref var set for the same key — startup exits 1"
      - "Secret ARN/resource name typo — startup exits 1 with a named fetch failure"

    gherkin: |
      Scenario: Server starts with the admin key sourced from AWS Secrets Manager
        Given DATABASE_URL and EMBYR_ENCRYPTION_KEY are set to valid values
        And EMBYR_ADMIN_KEY_AWS_SECRET_ARN points to a secret containing "prod-admin-secret-xyz"
        And plain EMBYR_ADMIN_KEY is not set
        When Sam runs "cargo run -p embyr-server"
        Then the server starts successfully and logs "embyr-server ready"
        And a request with "Authorization: Bearer prod-admin-secret-xyz" to an operator route succeeds
        And shared artifact "${admin_secret_ref}" matches source

  - id: 2
    name: "Server starts, fetches both secrets, ready"
    command: "kubectl logs deploy/embyr-server -f"

    tui_mockup: |
      +-- Step 2: Startup — secrets fetched, server ready --------------+
      | [INFO] fetched EMBYR_ADMIN_KEY from AWS Secrets Manager         |
      |        (arn=${admin_secret_ref})                                |
      | [INFO] fetched EMBYR_ENCRYPTION_KEY from AWS Secrets Manager    |
      |        (arn=${encryption_secret_ref})                           |
      | [INFO] embyr-server ready grpc=... rest=... admin=...          |
      +------------------------------------------------------------------+

    shared_artifacts:
      - name: "fetched_secret_value"
        source: "AwsSecretFetcher::fetch_fresh_raw / GcpSecretFetcher::fetch_fresh_raw (in-process only)"
        displayed_as: "(never displayed — invariant: never logged, never in system DB, never echoed)"
        consumers: ["ServerConfig.admin_key", "ServerConfig.encryption_key"]

    emotional_state:
      entry: "Cautious"
      exit: "Watchful confidence — server is up, first authenticated request succeeds"

    integration_checkpoint: |
      Log lines name the secret reference (ARN/resource name), never the fetched value.
      Fetch failure (access denied, not found, malformed) causes exit 1, no port bound.

    failure_modes:
      - "IAM policy denies secretsmanager:GetSecretValue on the configured ARN — exit 1"
      - "GCP Secret Manager returns 403/404 — exit 1"
      - "Fetched EMBYR_ENCRYPTION_KEY value is not 64 hex chars — exit 1 (same validation as plain-env-var path)"

    gherkin: |
      Scenario: Secret value is never written to the system DB or echoed in logs
        Given EMBYR_ADMIN_KEY_AWS_SECRET_ARN points to a secret containing "sentinel-do-not-log-987"
        When the server starts and handles 5 operator API requests
        Then no log line at any level contains "sentinel-do-not-log-987"
        And no row in the system DB contains "sentinel-do-not-log-987"

  - id: 3
    name: "Rotate EMBYR_ENCRYPTION_KEY (dual-key decrypt window)"
    command: "kubectl apply -f embyr-server-deployment-rotate-enc.yaml"

    tui_mockup: |
      +-- Step 3: Rotate the encryption key -----------------------------+
      | [INFO] fetched EMBYR_ENCRYPTION_KEY (new version)                |
      | [INFO] EMBYR_ENCRYPTION_KEY_PREVIOUS configured —                |
      |        decrypt fallback active                                   |
      | # Maria Santos signs in with her existing authenticator app     |
      | POST /admin/v1/auth/signin  {"totp_code":"482913"}  -> 200 ok   |
      +------------------------------------------------------------------+

    shared_artifacts:
      - name: "totp_secret_enc"
        source: "users.totp_secret_enc column (Postgres, encrypted at TOTP enrollment time)"
        displayed_as: "n/a (ciphertext only, never rendered)"
        consumers: ["auth.rs signin TOTP verification (decrypt: current key, then previous key)"]
      - name: "EMBYR_ENCRYPTION_KEY_PREVIOUS"
        source: "deployment manifest env var (plain or AWS/GCP secret-ref, same rules as EMBYR_ENCRYPTION_KEY)"
        displayed_as: "n/a (value never logged)"
        consumers: ["shared rotation-aware decrypt helper (auth.rs; available to oidc_providers.rs, projects.rs)"]

    emotional_state:
      entry: "Focused, methodical — this is the riskiest step"
      exit: "Relief — an existing user's sign-in proves the fallback works against real data"

    integration_checkpoint: |
      New writes (TOTP enrollment, OIDC client_secret, project DSN) always encrypt under the
      CURRENT key only. Decrypt tries current key first, falls back to previous key only on
      AEAD authentication failure. A ciphertext that fails under both keys returns the same
      decrypt-failure response as today — never a false-positive success.

    failure_modes:
      - "EMBYR_ENCRYPTION_KEY_PREVIOUS equals EMBYR_ENCRYPTION_KEY — startup exits 1"
      - "Corrupted ciphertext fails AEAD auth under both keys — existing decrypt-failure response, not silent corruption"
      - "Operator drops EMBYR_ENCRYPTION_KEY_PREVIOUS before every consumer has re-authenticated at least once — rows never touched during the window remain undecryptable after the window closes (documented operational risk, not a system defect; no lazy re-encryption in this slice — see D-SM-5)"

    gherkin: |
      Scenario: Existing TOTP secret decrypts via the previous key during the rotation window
        Given Maria Santos enrolled TOTP before rotation; her totp_secret_enc is encrypted under the OLD key
        And EMBYR_ENCRYPTION_KEY is set to the NEW key and EMBYR_ENCRYPTION_KEY_PREVIOUS is set to the OLD key
        When Maria signs in with her existing authenticator app code
        Then sign-in succeeds
        And shared artifact "totp_secret_enc" is decrypted via the previous-key fallback

  - id: 4
    name: "Rotate EMBYR_ADMIN_KEY (dual-token accept window)"
    command: "kubectl apply -f embyr-server-deployment-rotate-admin.yaml"

    tui_mockup: |
      +-- Step 4: Rotate the admin bearer token --------------------------+
      | # Grafana scraper on the OLD token — unaffected                 |
      | GET /metrics  Authorization: Bearer ${old_admin_token}  -> 200  |
      | # CI pipeline already on the NEW token — also works             |
      | GET /admin/v1/projects Authorization: Bearer ${new_admin_token} -> 200 |
      +------------------------------------------------------------------+

    shared_artifacts:
      - name: "admin_key / admin_key_previous"
        source: "OperatorState.admin_key / OperatorState.admin_key_previous (from ServerConfig)"
        displayed_as: "n/a (token values never logged)"
        consumers: ["operator_auth_middleware (all /admin/v1/* operator routes, /metrics)"]

    emotional_state:
      entry: "Focused"
      exit: "In control — both old and new clients keep working, no coordinated flag day"

    integration_checkpoint: |
      operator_auth_middleware accepts a Bearer token equal to EITHER admin_key OR
      admin_key_previous (when configured). /metrics uses the same middleware as every other
      operator route — no separate auth path to keep in sync.

    failure_modes:
      - "EMBYR_ADMIN_KEY_PREVIOUS equals EMBYR_ADMIN_KEY — startup exits 1"
      - "Token matches neither value — 401, unchanged from today"

    gherkin: |
      Scenario: Both current and previous admin tokens are accepted during the rotation window
        Given EMBYR_ADMIN_KEY is set to "new-token-2026" and EMBYR_ADMIN_KEY_PREVIOUS is set to "old-token-2025"
        When a request to GET /metrics carries "Authorization: Bearer old-token-2025"
        Then the response is HTTP 200
        When a request to GET /admin/v1/projects carries "Authorization: Bearer new-token-2026"
        Then the response is HTTP 200

  - id: 5
    name: "Close the rotation window"
    command: "kubectl apply -f embyr-server-deployment-final.yaml"

    tui_mockup: |
      +-- Step 5: Close the window — rotation complete -------------------+
      | [INFO] embyr-server ready ...  # no "_PREVIOUS configured" line  |
      | GET /metrics  Authorization: Bearer ${old_admin_token}  -> 401  |
      +------------------------------------------------------------------+

    shared_artifacts: []

    emotional_state:
      entry: "Watchful"
      exit: "Confident — that was routine; nothing broke, nothing was orphaned"

    integration_checkpoint: |
      Removing *_PREVIOUS env vars and restarting immediately invalidates the retired
      token/key candidate. No residual grace period beyond the operator's own restart timing.

    failure_modes:
      - "A forgotten client still using the retired token after the window closes — clean 401, same failure mode as an always-invalid token"

    gherkin: |
      Scenario: Retired admin token is rejected once the rotation window is closed
        Given EMBYR_ADMIN_KEY_PREVIOUS has been removed from the environment and the server restarted
        When a request to GET /metrics carries "Authorization: Bearer old-token-2025"
        Then the response is HTTP 401

integration_validation:
  shared_artifact_consistency:
    - artifact: "admin_secret_ref / encryption_secret_ref"
      must_match_across: [1, 2]
      failure_message: "Startup log must name the same ARN/resource reference configured in the manifest"
    - artifact: "admin_key / admin_key_previous"
      must_match_across: [4, 5]
      failure_message: "operator_auth_middleware must honor exactly the candidate set configured at startup — no stale acceptance after restart"

changelog:
  - date: "2026-08-09"
    feature: "secrets-management"
    change: "Initial DISCUSS wave journey — secrets-manager sourcing (US-SM-01, US-SM-02) and dual-key/dual-token rotation windows (US-SM-03, US-SM-04)"
