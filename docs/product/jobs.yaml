# NOTE (anonymous-sessions DISCUSS, 2026-08-30): JOB-20 is a new job for a
# fourth, distinct end-user-identity-establishment mechanism (same persona,
# P1 Alex) — an identity obtained with ZERO prior credential of any kind,
# materially different from JOB-16 (custom-token, Trailmark's own backend
# mints), JOB-18 (hosted email/password, Maria types a password), and JOB-19
