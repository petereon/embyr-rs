  - id: JOB-19
    name: oauth-provider-identity
    persona: P1
    feature: oauth-providers
    job_story: >
      When my app's end users already have a Google account and no interest in creating
      yet another password, I want them to sign in to Trailmark using their existing
      Google account through embyr, so my end users get the same one-click "Sign in with
      Google" experience Firebase's built-in OAuth providers gave them, without me having
      to build my own OAuth token-exchange plumbing or hand embyr a secret to custody on
      my behalf.
    dimensions:
      functional: >
        Maria signs in via the SDK's existing signInWithPopup()/signInWithRedirect()
        call with GoogleAuthProvider; embyr verifies the Google-issued ID token against
        Google's own published keys and mints a VerifiedEndUserIdentity, identical in
        shape to every other identity mechanism this codebase already produces; embyr
        custodies no third-party secret and no end-user password for this path
      emotional: >
        Alex feels he doesn't have to build OAuth token-exchange logic or hand embyr a
        secret to custody just to offer "Sign in with Google"; Maria feels she can sign
        in in one click using an account she already trusts, without creating and
        remembering yet another password
      social: >
        Alex can tell his team "we support Sign in with Google the same way Firebase
        did"; Trailmark's end users see the same one-click Google button they expect
        from any modern app
    four_forces:
      push: >
        Neither JOB-16 (custom-token, requires Trailmark's own backend to mint) nor
        JOB-18 (hosted email/password, requires Maria to create and remember a new
        password) serves the segment of end users who already have a Google account and
        expect one-click social sign-in — a materially common Firebase Auth usage
        pattern this codebase does not yet support at all
      pull: >
        A verified Google identity, resolving to the same VerifiedEndUserIdentity type
        every other mechanism already produces, gives Alex "Sign in with Google" parity
        with Firebase without operating a password-storage surface or a backend of his
        own
      anxiety: >
        "Does embyr now need to hold a secret that lets it act as my end users' Google
        identity, the way it holds their password in hosted identity?" — mitigated for
        Google specifically because the ID-token verification flow requires no client
        secret, only a public OAuth Client ID Alex registers himself (mirrors
        client_identity_credentials' own public-key-only, no-confidentiality-property
        design) — a genuinely lower-custody-risk shape than hosted identity's password
        storage. The deeper question (whether a future non-OIDC provider requiring
        server-side token exchange would require embyr to custody a customer's own
        third-party client secret) is NOT resolved by this job and is explicitly
        deferred — see Job Discovery Framing Resolution, Resolution 1
      habit: >
        Alex is used to Firebase's GoogleAuthProvider/signInWithPopup() pattern; "Sign
        in with Google" is one of the most common Firebase Auth methods in production
        apps, more familiar to most end users than either a custom-token bridge or
        creating a new password
    opportunity_score: 11
    priority: high
