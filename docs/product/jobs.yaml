jobs:
  - id: JOB-01
    name: sdk-compat
    persona: P1
    job_story: >
      When I have an app that uses the Firebase SDK, I want to point it at an embyr
      endpoint and have it behave identically to Google Firestore, so I can eliminate
      vendor lock-in and keep data in a region I control.
    dimensions:
      functional: Use firebase.initializeApp pointing at embyr; all SDK calls succeed unchanged
      emotional: Feel confident the migration won't break production; feel in control of data residency
      social: Be seen as infrastructure-independent; avoid "locked into Google" reputation
    opportunity_score: 18
    priority: critical
    # NOTE (aggregation-queries DISCUSS, 2026-08-30): this job's functional
    # dimension ("all SDK calls succeed unchanged") is now realized for the
    # SDK's aggregate-query surface (.count()/.sum()/.average()) via this
    # feature — same job, same persona (P1 Alex), not a new job (mirrors the
    # "make it real"/close-the-remaining-gap pattern of admin-api-v2 -> JOB-10
    # and card-payments-backend -> JOB-14, not the Identity track's own
    # "same persona, different goal -> new job" pattern). Investigation found
    # RunAggregationQuery's absence from the client-facing
    # google.firestore.v1.Firestore proto was NOT a deliberate exclusion —
    # docs/SPEC.md already documented a complete contract, and BC-2 Document
    # Storage's own ubiquitous language (adr-002-bounded-contexts.md) already
    # named "AggregationQuery" — a documented-but-unbuilt gap, not a founding
    # decision. Reuses embyr_core::access_control::check_query_compliance()
    # (ADR-031/032) unchanged for access-rule enforcement over the
    # aggregation's own underlying filter tree. v1 scope: COUNT for all
    # backend_mode families; SUM/AVG for direct_pg/aws_secret/gcp_secret only
    # (backend_mode=agent SUM/AVG deferred — requires extending
    # embyr-agent's own internal proto, a separate deployment artifact). One
    # genuinely unresolved item is explicitly escalated, not decided: whether
    # real Firestore's own RunAggregationQuery wire method is unary or
    # server-streaming (OQ-AGG-01) — this DISCUSS had no tool available to
    # verify against the actual public googleapis proto/SDK stubs. See
    # docs/feature/aggregation-queries/feature-delta.md § Job Discovery
    # Framing Resolution and § Handoff Package.
    # NOTE (client-auth DISCUSS, 2026-08-16): this job's functional dimension
    # ("all SDK calls succeed unchanged") is scoped to the Firestore data-plane
    # SDK surface (setDoc/getDoc/onSnapshot/etc, per the shipped embyr-rs
    # feature) — it does not extend to the Firebase Auth SDK surface. JOB-16
    # (client-identity-verification) is a distinct, new job for per-end-user
    # identity, not an extension of this job's scope. See
    # docs/feature/client-auth/feature-delta.md § Job Discovery Framing
    # Resolution for why this is a new job rather than a JOB-01 amendment.
    # NOTE (batch-get-documents DISCUSS, 2026-08-30): this job's functional
    # dimension is now also realized for the SDK's batch document-resolution
    # surface (db.getAll(...)) via this feature — same job, same persona
    # (P1 Alex), not a new job (the "make it real"/close-the-remaining-gap
    # pattern, same as aggregation-queries -> JOB-01 and admin-api-v2 ->
    # JOB-10). Unlike aggregation-queries, no proto-surface gap existed —
    # BatchGetDocumentsRequest/Response were already fully vendored with
    # correct field numbers; only the handler body was an unimplemented stub.
    # Reuses handle_get_document's own per-document access-control sequence
    # (get_access_rule/parse_condition/evaluate(), ADR-027/029) N times, once
    # per requested document, unchanged. No dependency on aggregation-queries
    # — a separate, independent, parallel completion of this same job. Zero
    # escalated open questions this time (unlike aggregation-queries' own
    # OQ-AGG-01) — every judgment call (single-slice scope, per-call vs.
    # per-document granularity, Deny-rejects-the-whole-batch behavior) was
    # resolvable directly from this codebase's own already-shipped
    # precedent. See docs/feature/batch-get-documents/feature-delta.md § Job
    # Discovery Framing Resolution.
    # NOTE (firestore-write-streaming DISCUSS, 2026-08-30): this job's
    # functional dimension is now also realized for the SDK's own default
    # offline-write-durability behavior (the internal Write bidi-stream
    # transport, used for offline-queue flushing / write-ahead durability —
    # never called directly by Alex's own app code) via this feature — same
    # job, same persona (P1 Alex), not a new job. A genuinely different gap
    # category from both prior JOB-01 realizations: the Write RPC and its
    # WriteRequest/WriteResponse envelope messages are net-new proto (like
    # aggregation-queries' own gap), but their complete wire contract was
    # already fully documented locally in docs/SPEC.md §Write Stream before
    # this DISCUSS ran (unlike aggregation-queries' own OQ-AGG-01, which had
    # no local documentation and required the orchestrator's own
    # moderate-confidence recall). Reuses handle_commit's own write-
    # application primitive (proto Write -> DomainWrite translation, atomic
    # apply) unchanged, and handle_listen's own bidi-streaming Rust/tonic
    # scaffold (peek-first-message-for-auth, then spawn a task owning the
    # stream) for its shape — but requires a genuinely new receive-and-reply
    # loop shape, since Listen's own spawned task only drains further client
    # messages rather than processing each one as its own apply-and-reply
    # cycle. Scoped to backend_mode in {direct_pg, aws_secret, gcp_secret};
    # backend_mode=agent is explicitly deferred as a candidate follow-up
    # feature (StorageAgent's own proto has zero bidi-streaming RPC today —
    # a structurally larger gap than aggregation-queries' own agent-mode
    # slice, which extended an existing unary shape). Two judgment calls are
    # explicitly escalated to DESIGN, not decided here: the exact
    # stream_token mismatch/expiry rejection mechanism (docs/SPEC.md's own
    # documented contract specifies token formats and the write-loop shape
    # but not mismatch behavior), and confirmation that deferring
    # backend_mode=agent is acceptable given JOB-04/JOB-09's own
    # credential-isolation customers remain unserved by Write until that
    # follow-up ships. See
    # docs/feature/firestore-write-streaming/feature-delta.md § Job
    # Discovery Framing Resolution and § Handoff Package.
    # NOTE (firestore-batch-write DISCUSS, 2026-08-31): this job's own
    # functional dimension is now also realized for the SDK's own
    # non-transactional bulk-write surface (db.bulkWriter(), used for "best
    # effort, tell me what succeeded" bulk operations — distinct from
    # db.batch().commit(), which already routes through Commit/handle_commit)
    # via this feature — same job, same persona (P1 Alex), not a new job (the
    # "make it real"/close-the-remaining-gap pattern, same as
    # aggregation-queries -> JOB-01, batch-get-documents -> JOB-01,
    # firestore-write-streaming -> JOB-01). A distinct gap category from
    # firestore-write-streaming's own: BatchWrite is unary (one request, one
    # response, no stream/session lifecycle) but, like Write, is net-new proto
    # (BatchWriteRequest/BatchWriteResponse do not exist in the vendored
    # google.firestore.v1 tree) with a complete wire contract already
    # documented locally in docs/SPEC.md §BatchWrite before this DISCUSS ran.
    # `handle_commit`'s own write-translation/access-rule-evaluation logic is
    # a REUSE TARGET, not reused verbatim: unlike Write (which reuses
    # translate_writes_for_commit() unchanged, since a single WriteRequest
    # batch is still all-or-nothing per SPEC.md), BatchWrite's own
    # per-write-independent-failure contract requires a NEW per-write
    # translate-and-catch-without-aborting variant, since
    # translate_writes_for_commit() itself aborts the whole call on the first
    # write-rule denial. The central architectural question was confirmed
    # directly in code, not by assumption: embyr-pg-storage's own
    # commit_transaction is genuinely all-or-nothing PER CALL (one Postgres
    # transaction, one failed precondition rolls back every write passed to
    # that call) — so per-write isolation requires calling
    # begin_transaction()+commit_transaction() ONCE PER WRITE (a
    # single-element writes Vec each time), not once for the whole batch. This
    # is a straightforward reuse of TWO already-existing BackendAdapter trait
    # methods in a loop, corroborated by firestore-write-streaming's own
    # ADR-046 finding (which needed the identical
    # begin_transaction-before-commit_transaction synthesis, at a coarser
    # per-WriteRequest-batch granularity) — NOT a new trait method, NOT a new
    # mechanism class. One genuine judgment call is explicitly escalated to
    # DESIGN, not decided here: unlike firestore-write-streaming (whose
    # agent-mode gap was a total proto-surface absence), backend_mode=agent
    # BatchWrite is structurally FEASIBLE today — StorageAgent's own proto
    # already has BeginTransaction/Commit/Rollback RPCs the same per-write
    # loop can reuse — but doing so means N sequential mTLS round trips per
    # BatchWrite call instead of one local Postgres transaction; DESIGN must
    # decide whether that trade-off is acceptable for v1 or should be
    # deferred. See docs/feature/firestore-batch-write/feature-delta.md § Job
    # Discovery Framing Resolution and § Handoff Package.
    # NOTE (firestore-list-rpcs DISCUSS, 2026-08-31): this job's own
    # functional dimension is now also realized for the SDK's own basic
    # enumeration surface (collectionRef.listDocuments(),
    # docRef.listCollections()) via this feature — same job, same persona
    # (P1 Alex), not a new job (the "make it real"/close-the-remaining-gap
    # pattern, same as every other RPC-completion feature this session).
    # These are the last two undeclared unary RPCs in docs/SPEC.md's own
    # ### Unary RPCs section. Investigation found the two RPCs share a single
    # underlying query primitive ("find the immediate children of a path")
    # and an already-proven pagination mechanism (a hex-encoded-offset
    # page_token, already implemented once in
    # crates/embyr-agent/src/server.rs::list_documents) — stronger evidence
    # for bundling them into one feature than mere superficial similarity.
    # ListDocuments requires zero new BackendAdapter trait method (reuses
    # run_query, already backend-agnostic); ListCollectionIds needs one
    # genuinely new query primitive (distinct immediate-child collection
    # names under a path prefix) nothing in this codebase does today.
    # Agent-mode ListCollectionIds is deferred (StorageAgent's own proto has
    # no such RPC — a hard wall mirroring Write's own original ADR-047 gap).
    # One judgment call is explicitly escalated to DESIGN, not decided here:
    # ListDocuments' own agent-mode routing — reuse run_query uniformly
    # (leaving the agent binary's own already-implemented, never-called
    # ListDocuments RPC orphaned) vs. special-casing AgentBackendAdapter to
    # call that existing RPC directly (more efficient, but requires
    # reconciling its own narrower collection_id-is-already-a-full-path
    # assumption against docs/SPEC.md's parent+collection_id convention).
    # See docs/feature/firestore-list-rpcs/feature-delta.md § Bundle-vs-Split
    # Verdict and § Handoff Package.
    # NOTE (firestore-field-transforms DISCUSS, 2026-08-31): this job's own
    # functional dimension is now also realized for the SDK's field-transform
    # sentinels (FieldValue.serverTimestamp()/.increment()/.arrayUnion()/
    # .arrayRemove(), plus the less-common maximum/minimum pair) via this
    # feature — same job, same persona (P1 Alex), not a new job (the "make it
    # real"/close-the-remaining-gap pattern, same as every other RPC/gap-
    # completion feature this session). Distinct gap category from every
    # prior JOB-01 realization: this is NOT an undeclared RPC — Commit/Write/
    # BatchWrite already exist and already parse DocumentTransform off the
    # wire — it is a silently-discarded computation. `translate_one_write_
    # for_commit`'s own Transform arm (crates/embyr-server/src/grpc/
    # handler.rs) always produces `DomainWrite::Transform { transforms:
    # vec![] }` regardless of what the client sent; embyr-core's own
    # `FieldTransform` enum (crates/embyr-core/src/storage/backend_adapter.rs)
    # models only 1 of 6 real transform kinds (ServerTimestamp); the domain
    # `WriteResult` struct has no field at all to carry transform_results
    # back to the client, and every proto-response call site hardcodes
    # `transform_results: vec![]`. Confirmed silent data loss (write accepted
    # 200/OK, no field actually set/incremented/modified), not a clean error
    # — the highest real-world-impact gap remaining in this codebase's
    # Firestore parity (serverTimestamp()/increment() are among the most
    # common real SDK calls: auto-timestamps, counters, inventory). Two
    # genuine judgment calls escalated to DESIGN, not decided here: (1)
    # integer-overflow behavior for `increment` is unspecified by both
    # docs/SPEC.md and this DISCUSS's own evidence; (2) docs/SPEC.md's own
    # § Field Transforms table is internally inconsistent about whether
    # array-transform kinds populate `transform_results` at all, and omits
    # `maximum`/`minimum` entirely. See docs/feature/firestore-field-
    # transforms/feature-delta.md § Reading Confirmation and § Handoff
    # Package.
    # NOTE (agent-mode-write-streaming / agent-mode-list-collection-ids /
    # agent-mode-field-transforms DISCUSS, 2026-08-31): three further JOB-01
    # realizations, all `backend_mode=agent` extensions of gaps already closed
    # for direct_pg/aws_secret/gcp_secret by firestore-write-streaming,
    # firestore-list-rpcs, and firestore-field-transforms respectively — same
    # job, same persona (P1 Alex, this time at Meridian Health, a healthcare
    # company using backend_mode=agent for HIPAA data-residency control, a
    # direct realization of this job's own "feel in control of data
    # residency" emotional dimension). Investigated as a candidate single
    # bundled feature and explicitly SPLIT into 4 independent features
    # (including agent-mode-transaction-purge, filed under JOB-12 not JOB-01
    # — see that job's own NOTE below) after confirming no shared proto-
    # versioning mechanism would be built that the others could reuse — see
    # docs/feature/agent-mode-write-streaming/feature-delta.md § Bundle-vs-
    # Split Note. Cross-cutting finding shared by all 3 of these features:
    # docs/SPEC.md line 503 documents "the agent binary version must match
    # the embyr SaaS major version" as POLICY, with no runtime enforcement
    # mechanism (Ping carries no version field) — escalated to DESIGN once,
    # referenced not re-litigated in the 2 smaller sibling features. See each
    # feature's own § Handoff Package.
    # NOTE (firestore-composite-indexes-admin-api DISCUSS, 2026-09-04, applied
    # late during composite-index-requirement-rules DISCUSS — a back
    # -propagation gap: this NOTE was promised in that feature's own
    # feature-delta.md § SSOT Updates but never actually applied to this
    # file): JOB-01 now also covers a composite-index admin CRUD surface
    # (Create/List/Delete), closing a documented-but-unbuilt gap — the
    # `composite_indexes` table + `IndexManager`/`requires_composite_index`
    # gating have existed, correctly wired, since the original walking
    # skeleton (04-02) — with no way for Alex to ever satisfy the resulting
    # `FAILED_PRECONDITION` until that feature. Same job, same persona, not a
    # new job. See docs/evolution/2026-09-04-firestore-composite-indexes
    # -admin-api.md.
    # NOTE (composite-index-requirement-rules DISCUSS, 2026-09-04): JOB-01
    # now also covers accurate composite-index REQUIREMENT DETECTION —
    # widening `requires_composite_index`'s own heuristic to match all 5 of
    # `docs/SPEC.md`'s own documented trigger shapes (multi-field `orderBy`;
    # inequality-or-equality filter + `orderBy` on a different field;
    # `array-contains-any`; `not-in`; `IN` with more than one equality
    # constraint), up from 3 of 5 previously correctly detected — plus naming
    # the specific missing index in the rejection, closing the loop
    # `firestore-composite-indexes-admin-api` opened. Same job, same
    # persona, not a new job. Central finding, reversing this DISCUSS's own
    # initial hypothesis: the codebase's OWN existing evidenced test
    # (equality filter + different-field `orderBy`) was ALREADY Firestore
    # -accurate, confirmed by live web verification against firebase.
    # google.com — the genuine gaps were multi-field `orderBy` (uncaught
    # entirely) and `IN`+range-on-a-different-field when filter-only
    # (bypassed by a top-level `order_by.is_empty()` short-circuit). See
    # docs/feature/composite-index-requirement-rules/feature-delta.md
    # § Resolution 2/3.
    # NOTE (firestore-query-filter-operator-support DISCUSS, 2026-09-05):
    # JOB-01 now also covers 4 previously-panicking Firestore query filter
    # operators (`in`/`not-in`/`array-contains`/`array-contains-any`) — same
    # job, same persona, not a new job. The highest-severity realization of
    # this job's own "make it real" pattern this session: closes an active
    # production CRASH, not merely an accuracy gap. Discovered as a flagged
    # follow-up from `composite-index-requirement-rules`'s own FINALIZE
    # (2026-09-05). Central design finding: `not-in`'s own live-verified
    # field-must-exist rule requires zero explicit existence-check code for
    # the non-empty-list case — it falls out of Postgres's own `NULL`
    # three-valued-logic propagation, identically to how the pre-existing
    # `!=` operator already gets this right by accident. See
    # docs/feature/firestore-query-filter-operator-support/feature-delta.md
    # § Resolution 2.
    # NOTE (firestore-equal-notequal-value-type-support DISCUSS, 2026-09-05):
    # JOB-01 now also covers `Equal`/`NotEqual` support for every
    # `FieldValue` type (`Timestamp`/`Bytes`/`Reference`/`Array`/`Map`,
    # previously panicking) — same job, same persona, not a new job. Direct
    # continuation of `firestore-query-filter-operator-support`'s own
    # flagged follow-up. Zero new production logic: routes both operators
    # to that feature's own already-existing `push_value_equality` helper.
    # Side effect: a previously-permissive cross-numeric-type coercion
    # (`Equal(Integer)` matching a stored `Double`) is now correctly type
    # -strict, matching real Firestore's own semantics more precisely.
    # Range-operator support for these same 5 types is a separate, real,
    # deferred gap (candidate id
    # `firestore-range-operator-value-type-support`). See
    # docs/feature/firestore-equal-notequal-value-type-support/
    # feature-delta.md § Resolution 2/3.
    # NOTE (firestore-range-operator-value-type-support DISCUSS, 2026-09-06):
    # JOB-01 now also covers range-operator (</<=/>/>=) support for
    # `Timestamp`/`Bytes`/`Reference`-valued filter targets (previously
    # panicking), plus a clean `INVALID_ARGUMENT` rejection (instead of a
    # crash) for `Array`/`Map`-valued targets, matching real Firestore's own
    # actual behavior (`Array` range queries are confirmed unsupported by
    # real Firestore itself; `Map`'s own support is unconfirmed, treated
    # conservatively) — same job, same persona, not a new job. Direct
    # continuation of `firestore-equal-notequal-value-type-support`'s own
    # flagged follow-up. `Timestamp` uses Postgres `ROW(...)` comparison
    # over its own stored `(seconds, nanos)` fields; `Bytes` decodes
    # standard-base64 to raw `bytea` for byte-wise comparison (base64 TEXT
    # comparison would be WRONG — its own alphabet does not preserve
    # byte-value ordering); `Reference` uses flat string comparison
    # (real-Firestore-accurate for same-depth references, a named
    # divergence for cross-depth ones). See
    # docs/feature/firestore-range-operator-value-type-support/
    # feature-delta.md § Resolution 2 through 5.
    # NOTE (firestore-transaction-read-consistency DISCUSS, 2026-09-06): JOB-01
    # now also covers transactional-read optimistic-concurrency control for
    # `GetDocument`/`RunQuery`/`BatchGetDocuments` — a real `runTransaction(fn)`
    # callback's own reads now participate in the same OCC guarantee real
    # Firestore gives them (a document read inside a transaction that changes
    # before commit aborts the transaction with `ABORTED`), closing a
    # documented-but-unbuilt SPEC.md gap (§Transactions' own
    # `GetDocumentForTransaction`/`CommitTransaction` contract existed in
    # SPEC.md but was never implemented — the `transactions` table had no
    # `reads` column at all). Same job, same persona, not a new job. Reuses
    # `crates/embyr-pg-storage/src/transactions/occ.rs::verify_versions`'s own
    # FOR-UPDATE-lock-and-compare mechanism as a direct sibling
    # (`verify_reads`), zero new `CoreError` variant. Identified as the
    # highest-real-world-impact finding in a 2026-09-06 production-readiness
    # scan, ranked above the already-closed 3-feature crash-elimination arc
    # because the failure mode is a SILENT lost update, not a visible panic.
    # `backend_mode=agent` is explicitly deferred (separate candidate feature,
    # mirroring the established agent-mode-deferral pattern). See
    # docs/feature/firestore-transaction-read-consistency/feature-delta.md.
    # NOTE (firestore-end-cursor-support DISCUSS, 2026-09-07): JOB-01 now also
    # covers `RunQuery`'s `endAt`/`endBefore` cursors correctly bounding
    # results (previously silently ignored — `sq_proto.end_at` was parsed
    # nowhere, hardcoded `None`), plus a closely-coupled fix to `startAt`/
    # `startAfter`'s own operator selection for `DESC`-ordered queries
    # (previously always used the `ASC` operator regardless of sort
    # direction — a pre-existing bug discovered while implementing this
    # feature, not originally named in its own candidate framing). Same job,
    # same persona, not a new job. Identified as gap #2 in the 2026-09-06
    # production-readiness scan, same severity class as gap #1
    # (firestore-transaction-read-consistency): a well-behaved client
    # silently gets wrong (too many) rows, not an error. See
    # docs/feature/firestore-end-cursor-support/feature-delta.md.
    # NOTE (firestore-or-filter-support DISCUSS, 2026-09-07): JOB-01 now also
    # covers `Filter.or()` composite queries executing correctly (union
    # semantics, correct precedence when nested inside AND) — previously
    # rejected outright. This feature's own DISCUSS wave found and avoided a
    # real access-control-bypass risk in the naive fix:
    # `QueryFilter::Composite`'s AND-only assumption is load-bearing for
    # ADR-031's own `filter_binds_field_to_uid` security check (`.any()`
    # semantics, correct ONLY because every composite meant AND). Added a
    # strictly ADDITIVE `CompositeOr` domain variant (zero change to the 15
    # existing AND-only call sites) with its own `.all()` compliance-check
    # semantics — every branch of an OR must independently prove an
    # ownership-equality constraint for the query to be admitted, matching
    # real Firestore's own documented query-validation model.
    # `backend_mode=agent` cleanly rejects OR filters (its own internal
    # proto has no `Or` operator) rather than silently mistranslating them.
    # Same job, same persona, not a new job. See
    # docs/feature/firestore-or-filter-support/feature-delta.md § Reading
    # Confirmation, § System Constraints.
    # NOTE (firestore-is-null-filter-support DISCUSS, 2026-09-07): JOB-01 now
    # also covers `.where(field, '=='|'!=', null)` — lowered by every
    # official SDK to the proto's own `IS_NULL`/`IS_NOT_NULL` unary filter
    # ops, previously rejected outright alongside the already-supported
    # `IS_NAN`/`IS_NOT_NAN` siblings. Same job, same persona, not a new job;
    # no security dimension (confirmed: neither op can ever establish an
    # ownership-equality binding, so `filter_binds_field_to_uid` needs no
    # change). See docs/feature/firestore-is-null-filter-support/feature-delta.md.

  - id: JOB-02
    name: tenant-provision
    persona: P2
    job_story: >
      When I need to give a new customer their Firestore-compatible endpoint, I want to
      create a project via the admin API and hand them credentials, so they are up and
      running without manual database setup.
    dimensions:
      functional: POST /admin/v1/projects creates project, migrates DB, returns credentials
      emotional: Feel confident isolation invariant holds; feel efficient onboarding at scale
      social: Be trusted by customers that data is isolated
    opportunity_score: 12
    priority: high
    # NOTE (customer-db-onboarding DISCUSS, 2026-08-16): the automatic
    # `sqlx::migrate!` this job's functional dimension describes assumes
    # the submitted connection string carries DDL/schema-modification
    # rights. JOB-15 (customer-db-preflight) is the mirror-image job for
    # customers whose Postgres governance prohibits granting exactly that —
    # it does not change JOB-02's own scope, but JOB-02's provisioning
    # endpoint is the driving port JOB-15's verify-and-complain story
    # extends. See docs/feature/customer-db-onboarding/feature-delta.md.

  - id: JOB-03
    name: live-sync
    persona: P1
    job_story: >
      When multiple clients are reading and writing a shared collection, I want all
      connected onSnapshot listeners to receive changes within seconds, so I can build
      collaborative features without a separate pub-sub layer.
    dimensions:
      functional: onSnapshot fires for every committed write; resume tokens allow reconnect
      emotional: Feel confident that users see a consistent view
      social: Deliver a responsive collaborative UX that rivals Google Firestore
    opportunity_score: 15
    priority: critical

  - id: JOB-04
    name: credential-isolation
    persona: P4
    job_story: >
      When my security policy prohibits DB credentials from leaving my VPC, I want to
      deploy the embyr agent alongside my Postgres instance, so I can use the Firestore
      SDK without exposing credentials to any third party.
    dimensions:
      functional: embyr agent runs in-VPC; embyr SaaS never receives DSN
      emotional: Feel secure I will pass my next audit
      social: Demonstrate to auditors that zero credentials traverse the cloud boundary
    opportunity_score: 14
    priority: critical

  - id: JOB-05
    name: cloud-secret
    persona: P3
    job_story: >
      When my database credentials are already managed in AWS/GCP secret infrastructure,
      I want embyr to fetch them from there, so I don't have to operate yet another
      credential store.
    dimensions:
      functional: Provide secret ARN; embyr fetches DSN; password rotation is transparent
      emotional: Feel that operational surface area has not grown
      social: Be seen as running consistent, auditable secrets hygiene
    opportunity_score: 10
    priority: high

  - id: JOB-06
    name: tenant-control
