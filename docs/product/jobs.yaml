version: "1.0"
feature: embyr-rs
updated: "2026-08-08"

jobs:
  - id: JOB-01
    name: sdk-compat
    persona: P1
    job_story: >
      When I have an app that uses the Firebase SDK, I want to point it at an embyr
      endpoint and have it behave identically to Google Firestore, so I can eliminate
      vendor lock-in and keep data in a region I control.
    dimensions:
      functional: Use firebase.initializeApp pointing at embyr; all SDK calls succeed unchanged
      emotional: Feel confident the migration won't break production; feel in control of data residency
      social: Be seen as infrastructure-independent; avoid "locked into Google" reputation
    opportunity_score: 18
    priority: critical

  - id: JOB-02
    name: tenant-provision
    persona: P2
    job_story: >
      When I need to give a new customer their Firestore-compatible endpoint, I want to
      create a project via the admin API and hand them credentials, so they are up and
      running without manual database setup.
    dimensions:
      functional: POST /admin/v1/projects creates project, migrates DB, returns credentials
      emotional: Feel confident isolation invariant holds; feel efficient onboarding at scale
      social: Be trusted by customers that data is isolated
    opportunity_score: 12
    priority: high
    # NOTE (customer-db-onboarding DISCUSS, 2026-08-16): the automatic
    # `sqlx::migrate!` this job's functional dimension describes assumes
    # the submitted connection string carries DDL/schema-modification
    # rights. JOB-15 (customer-db-preflight) is the mirror-image job for
    # customers whose Postgres governance prohibits granting exactly that —
    # it does not change JOB-02's own scope, but JOB-02's provisioning
    # endpoint is the driving port JOB-15's verify-and-complain story
    # extends. See docs/feature/customer-db-onboarding/feature-delta.md.

  - id: JOB-03
    name: live-sync
    persona: P1
    job_story: >
      When multiple clients are reading and writing a shared collection, I want all
      connected onSnapshot listeners to receive changes within seconds, so I can build
      collaborative features without a separate pub-sub layer.
    dimensions:
      functional: onSnapshot fires for every committed write; resume tokens allow reconnect
      emotional: Feel confident that users see a consistent view
      social: Deliver a responsive collaborative UX that rivals Google Firestore
    opportunity_score: 15
    priority: critical

  - id: JOB-04
    name: credential-isolation
    persona: P4
    job_story: >
      When my security policy prohibits DB credentials from leaving my VPC, I want to
      deploy the embyr agent alongside my Postgres instance, so I can use the Firestore
      SDK without exposing credentials to any third party.
    dimensions:
      functional: embyr agent runs in-VPC; embyr SaaS never receives DSN
      emotional: Feel secure I will pass my next audit
      social: Demonstrate to auditors that zero credentials traverse the cloud boundary
    opportunity_score: 14
    priority: critical

  - id: JOB-05
    name: cloud-secret
    persona: P3
    job_story: >
      When my database credentials are already managed in AWS/GCP secret infrastructure,
      I want embyr to fetch them from there, so I don't have to operate yet another
      credential store.
    dimensions:
      functional: Provide secret ARN; embyr fetches DSN; password rotation is transparent
      emotional: Feel that operational surface area has not grown
      social: Be seen as running consistent, auditable secrets hygiene
    opportunity_score: 10
    priority: high

  - id: JOB-06
    name: tenant-control
    persona: P2
    job_story: >
      When a customer is overdue on payment or abusing the service, I want to suspend
      their project and see their usage metrics, so I can enforce SLAs without touching
      their documents.
    dimensions:
      functional: POST /suspend → PermissionDenied on all data requests; usage in daily_project_metrics
      emotional: Feel in control of costs
      social: Be trusted by investors that the service is self-sustaining
    opportunity_score: 9
    priority: medium

  - id: JOB-07
    name: agent-operations
    persona: P4
    feature: embyr-agent
    job_story: >
      When I need to put the embyr agent into production in my Kubernetes cluster,
      I want to configure it via environment variables, verify it connects successfully
      to Postgres and embyr SaaS, and know immediately if the startup fails, so I can
      complete the deployment in under 30 minutes and hand off a green health check to
      my SRE team.
    dimensions:
      functional: >
        EMBYR_AGENT_* env vars configure everything; agent exits non-zero with named missing var;
        agent logs "connected to Postgres" then "listening on :9191"; embyr SaaS accepts
        backend_mode=agent with endpoint + CA PEM in admin API
      emotional: Feel in control — startup errors are named and specific; no cryptic TLS failures
      social: Show the SRE team a clean deploy log without Slack escalations
    four_forces:
      push: Without the agent, deployment is blocked by security policy prohibiting credential egress
      pull: Structured log + startup probe means "it works" can be demoed in the first deploy session
      anxiety: TLS cert misconfiguration causes cryptic errors at 3am — mitigated by named startup errors
      habit: kubectl logs is the mental model; agent must emit machine-readable JSON logs compatible with Loki/Splunk
    opportunity_score: 16
    priority: critical

  - id: JOB-08
    name: agent-livesync
    persona: P1
    secondary_persona: P4
    feature: embyr-agent
    job_story: >
      When SDK clients use onSnapshot on a project backed by backend_mode=agent, I want
      the agent to forward Postgres NOTIFY events to the embyr SaaS via the Subscribe
      streaming RPC, so collaborative features work identically to direct-mode projects
      without the SDK knowing the difference.
    dimensions:
      functional: >
        Agent maintains Postgres LISTEN connection; pushes DocChange over Subscribe stream;
        embyr SaaS fans out to Listen targets; overflow triggers RESET; SaaS reconnects
        with exponential backoff 1s→30s
      emotional: Alex feels real-time UX is identical to Firestore (no awareness of agent mode)
      social: Alex can demo real-time collaboration without caveats about agent mode limitations
    four_forces:
      push: Without Subscribe, onSnapshot falls back to polling or shows stale data; collaborative features break
      pull: Subscribe with reconnect means agent mode is a full production peer of direct mode
      anxiety: Silent change loss when Subscribe stream drops — mitigated by RESET + re-snapshot guarantee
      habit: Alex tests real-time with Firebase Emulator; wants identical behavior from agent integration tests
    opportunity_score: 15
    priority: critical

  - id: JOB-09
    name: agent-auditproof
    persona: P4
    feature: embyr-agent
    job_story: >
      When my external security auditor asks me to demonstrate the "zero credential egress"
      claim, I want to show them the agent network traffic log, the embyr SaaS system DB
      entry (backend_mode=agent, no DSN stored), and the mTLS handshake log, so I can
      close the audit finding without writing a remediation plan.
    dimensions:
      functional: >
        System DB projects row shows backend_mode=agent, NULL backend_pg_creds_enc;
        agent logs show mTLS handshake at DEBUG; DSN is never echoed in any log line;
        agent GRPC wire logs contain no DSN strings
      emotional: Feel confident walking into the audit room; evidence is unambiguous and self-documenting
      social: Be seen by the auditor as operating a mature, evidence-based security posture
    four_forces:
      push: Open SOC2 finding — verbal claim insufficient; blocks contract renewal
      pull: System DB row + network capture = concrete non-repudiable evidence; finding closed
      anxiety: A bug logs the DSN at DEBUG level — mitigated by mandatory negative test (grep for sentinel)
      habit: Auditors expect DB record or config file as evidence; system DB row serves this role
    opportunity_score: 12
    priority: high

  - id: JOB-10
    name: account-admin
    persona: P5
    persona_name: Chris (Account Admin / Platform Engineer)
    feature: user-admin-ui
    job_story: >
      When I have an embyr account with multiple databases and a team of developers,
      I want a web UI to create and monitor databases, manage team access, view usage
      costs, and rotate SDK/admin keys, so I can operate self-sufficiently without
      contacting the embyr SaaS operator or writing admin API scripts.
    dimensions:
      functional: >
        Create/list/detail databases; view P95 latency + ops charts; manage Members +
        Service Accounts; create/revoke SDK + Admin keys; view billing breakdown;
        configure OIDC + account settings
      emotional: >
        Feel in control of the account; feel like a self-sufficient operator rather
        than a dependent customer; feel confident keys and access are under my governance
      social: >
        Be seen by the engineering team as running a mature, access-controlled data
        platform; demonstrate clean secrets hygiene to auditors
    four_forces:
      push: >
        No UI exists; all management requires raw admin API calls or asking the embyr
        operator; error-prone and time-consuming
      pull: >
        Dashboard + CRUD + key management via browser = complete self-service in minutes;
        no operator dependency for any routine task
      anxiety: >
        "What if I accidentally revoke a key in production?" — mitigated by
        confirm-before-revoke modal and key prefix display for identification
      habit: >
        Admins expect a web console (AWS Console, Vercel dashboard, Supabase studio
        mental model); CLI-only access creates friction and slows new-member onboarding
    opportunity_score: 16
    priority: critical
    # NOTE (card-payments DISCUSS, 2026-08-10): the "view billing breakdown"
    # functional item above (read-only usage reporting, feature=user-admin-ui)
    # is extended by JOB-14 (manage-subscription) into full subscription and
    # payment self-service. JOB-10 itself is unchanged; JOB-14 is a distinct
    # job because it carries financial/trust stakes (card capture, hard-stop
    # suspension, upgrade/downgrade decisions) that "view usage costs" alone
    # does not. See docs/feature/card-payments/feature-delta.md.

  - id: JOB-11
    name: fair-multitenancy
    persona: P2
    persona_name: Sam Chen (Service Operator / Platform Engineer)
    feature: distributed-rate-limiting
    job_story: >
      When I am running multiple customer projects on the same embyr deployment,
      I want per-project rate limits to be enforced consistently regardless of how
      many server instances are running, so that one project cannot consume more
      than its fair share when I scale horizontally.
    dimensions:
      functional: >
        Cluster-wide aggregate request count for any project is bounded at
        EMBYR_RATE_LIMIT_RPS; RESOURCE_EXHAUSTED returned when aggregate exceeds
        limit across all nodes; x-ratelimit-* headers on every gRPC response;
        retry-after-ms on rejections; per-instance fallback caps at 1x limit
        when system DB unreachable (not uncapped, not 2x)
      emotional: >
        Feel confident that adding a second embyr node does not inadvertently
        double each tenant's effective rate allowance; feel in control of the
        fairness guarantee without needing a separate coordination plane
      social: >
        Be trusted by all tenants that their rate-limit SLA is meaningful
        regardless of deployment topology; demonstrate to auditors that
        per-project limits are enforced cluster-wide
    four_forces:
      push: >
        Current per-instance token buckets mean a 3-node cluster allows 3x
        the configured RPS per project — a noisy tenant can starve others at
        scale and the operator has no enforceable guarantee to offer tenants
      pull: >
        Postgres rate_buckets atomic UPDATE means the same rate_buckets row
        is the single authority regardless of node count; Sam can confidently
        quote tenants a real per-project RPS limit
      anxiety: >
        "What if the Postgres UPDATE adds too much latency to every request?"
        — mitigated by 20ms hard timeout with in-process fallback; AC-14c
        p99 < 500us property test must remain green
      habit: >
        Sam is used to deploying stateless services and expects horizontal
        scaling to be purely additive for capacity; the distributed limiter
        must not require sticky routing or per-node configuration
    opportunity_score: 11
    priority: high
    # NOTE (card-payments-backend DISCUSS, 2026-08-11): D-9 (real-time
    # Free-plan cap enforcement) physically extends crates/embyr-server/
    # src/middleware/rate_limit.rs — the same file this job's distributed
    # token bucket lives in — but is a DIFFERENT concern: JOB-11 is about
    # per-second REQUEST-RATE fairness across tenants regardless of node
    # count; D-9 is about MONTHLY-CUMULATIVE usage vs. a paid-plan cap,
    # unrelated to horizontal scaling. Cross-referenced, not merged — see
    # docs/feature/card-payments-backend/feature-delta.md § Open Question.

  - id: JOB-12
    name: observability
    persona: P2
    persona_name: Sam Chen (Service Operator / Platform Engineer)
    feature: observability
    job_story: >
      When I am running embyr in production and a customer reports slow queries
      or anomalous behaviour, I want to query a Prometheus /metrics endpoint on
      the admin port and see gRPC request counts, error rates, latency
      histograms, rate-limit allow/reject counts, and Postgres pool stats, so
      I can diagnose the problem before the customer escalates and set SLO
      alerts that fire before customers notice.
    dimensions:
      functional: >
        GET :9090/metrics returns valid Prometheus text format;
        embyr_grpc_requests_total{method,status} increments on every RPC;
        embyr_grpc_request_duration_seconds_bucket{method} updated on every RPC;
        embyr_rate_limit_requests_total{project_id,outcome} updated on every
        rate-limit check; embyr_pg_pool_{idle,size} gauges updated each scrape
      emotional: >
        Feel in control when a customer calls — have data to diagnose in
        minutes, not hours; feel confident quoting SLOs to customers because
        the metrics prove the system is behaving correctly
      social: >
        Be seen by customers as a professional operator who catches problems
        before they do; demonstrate to auditors that rate-limiting is enforced
        per tenant by showing embyr_rate_limit_requests_total per project_id
    four_forces:
      push: >
        No visibility beyond tracing::warn! log lines — Sam must grep logs
        to count events; customer complaints arrive before any internal signal;
        JOB-11 fair-multitenancy has no observable proof beyond the rate_buckets
        table which Sam cannot query in real time
      pull: >
        Prometheus scrape + Grafana dashboard = proactive alerting; Sam sets
        an alert on embyr_grpc_request_duration_seconds p99 > 2s and gets
        paged before the customer knows; rate-limit chart per project proves
        fair-multitenancy to auditors without ad-hoc SQL queries
      anxiety: >
        "Adding instrumentation adds latency to every gRPC hot path" —
        mitigated by using the metrics crate's lock-free atomic counters;
        histogram recording is a single u64 increment after the handler returns
      habit: >
        Sam is used to Prometheus + Grafana from other infrastructure; the
        metrics endpoint must produce standard Prometheus exposition format
        so existing dashboards and alert rules work without modification
    opportunity_score: 13
    priority: high

  - id: JOB-13
    name: production-deployment
    persona: P2
    persona_name: Sam Chen (Service Operator / Platform Engineer)
    feature: production-readiness
    job_story: >
      When I want to deploy embyr to production, I want a single `docker run` command
      to start the server, so I can ship without writing infrastructure from scratch.
    dimensions:
      functional: >
        DATABASE_URL + EMBYR_ADMIN_KEY + EMBYR_ENCRYPTION_KEY env vars configure everything;
        server exits non-zero with named missing var; server runs 18 migrations, probes system
        DB, binds gRPC :8080 + REST :8081 + Admin :9090, logs "embyr-server ready";
        docker build succeeds from a clean checkout in < 5 minutes; final image < 100 MB;
        CI gates every PR with cargo test + clippy + docker build
      emotional: >
        Feel in control — startup errors are named and specific, no cryptic failures;
        feel confident that every merge is tested before it ships; feel productive
        deploying without needing to install a Rust toolchain on the target host
      social: >
        Show the team a clean green CI badge on every PR; demonstrate to stakeholders
        that embyr has a production-ready deployment path, not just a test suite
    four_forces:
      push: >
        main.rs is a stub — the binary exits immediately; no Dockerfile exists;
        no CI exists; a broken build can reach master and block the entire team
      pull: >
        docker run with three env vars starts the full server; CI green badge on
        every PR means Sam can merge with confidence; first production deployment
        takes < 30 minutes from a clean checkout
      anxiety: >
        "What if the container starts but the DB migrations didn't run?" —
        mitigated by migration-before-port-bind ordering and exit 1 on migration failure;
        no traffic is accepted until migrations and DB probe succeed
      habit: >
        Sam is used to Kubernetes + Docker deployments with env-var configuration;
        the embyr-server must follow 12-factor app conventions — no config files,
        no hardcoded defaults for security-critical values, clean exit codes
    opportunity_score: 15
    priority: critical

  - id: JOB-14
    name: manage-subscription
    persona: P5
    persona_name: Chris (Account Admin / Platform Engineer)
    feature: card-payments
    job_story: >
      When my account's usage is approaching or has exceeded my plan's limits, or my
      payment method needs updating, I want to see my current plan, my usage against
      caps, and my payment status clearly in one place, and be able to upgrade my plan
      or update my card myself, so I can avoid unexpected service interruption and stay
      in control of what I'm paying for — without contacting the embyr operator.
    dimensions:
      functional: >
        View current plan (Free/Pro) + payment method + per-dimension usage-against-cap
        breakdown (reads/writes/deletes/storage) + upcoming invoice estimate; add/update
        a card via Stripe Elements (PCI SAQ-A); upgrade Free→Pro or downgrade Pro→Free
        with explicit confirmation; view invoice history; see a clear reason and one-click
        recovery path when the console is suspended
      emotional: >
        Feel in control of spend — no surprise charges; feel reassured card data is
        handled securely; feel confident that approaching a cap won't silently drain
        more money, and that hitting a hard-stop won't blindside them without warning
      social: >
        Be seen internally by their own team as running a well-managed, cost-predictable
        data platform; never have to explain a surprise invoice or an unexplained outage
        to their own stakeholders
    four_forces:
      push: >
        Zero billing visibility exists today — crates/embyr-admin-ui/src/views/billing.rs
        shows only "—" placeholders; there is no way to add a card, no way to know
        proximity to a cap, and the only signal of trouble is the console suddenly
        refusing writes (D-6 hard-stop with no warning)
      pull: >
        A billing tab showing exact plan, usage-vs-cap bars with amber/red thresholds,
        and a clear "Upgrade to Pro" button removes the mystery — Chris can self-serve
        before hitting the wall instead of after
      anxiety: >
        "What if adding my card gets me charged for something I didn't agree to?" —
        mitigated by D-6's explicit no-auto-upgrade rule and the downgrade-confirmation
        warning. "Is my card data safe?" — mitigated by Stripe Elements PCI SAQ-A
        messaging ("embyr never sees the raw number")
      habit: >
        Chris expects SaaS billing patterns from AWS Console / Vercel / Stripe's own
        billing portal — plan card, payment-method card, usage bars, invoice table are
        all familiar idioms; the design should not invent a new mental model
    opportunity_score: 17
    priority: critical
    # NOTE (card-payments-backend DISCUSS, 2026-08-11): the functional
    # dimension above was validated against mock data only (feature=
    # card-payments). card-payments-backend makes it real: a Stripe
    # Customer/Subscription, webhook-driven sync, daily usage metering,
    # and real-time cap enforcement replacing the mock-derived
    # SuspensionBanner/TestClockCard state. JOB-14 itself is unchanged —
    # no new job was warranted, this is JOB-14's "make it real" backend
    # half, exactly as admin-api-v2 was JOB-10's backend half of
    # user-admin-ui. See docs/feature/card-payments-backend/feature-delta.md.

  - id: JOB-15
    name: customer-db-preflight
    persona: P6
    persona_name: Elena Vasquez (Customer Database Administrator)
    secondary_persona: P2
    feature: customer-db-onboarding
    job_story: >
      When my company's Postgres governance policy prohibits granting DDL/schema-
      modification privileges to any externally-controlled connection string, I want to
      apply the exact schema embyr requires myself, once, under my own elevated DBA
      credentials, so I can then hand embyr's operations team a lower-privilege,
      DML-only connection string and complete onboarding without violating our
      credential-privilege policy.
    dimensions:
      functional: >
        Elena runs an embyr-provided database-preparation step against her Postgres
        using her own elevated login; the step applies the exact migration set embyr-
        server itself embeds and reports a clear success/failure signal with the
        schema version applied. embyr's provisioning flow verifies the target database
        matches the expected schema before completing onboarding, and returns a
        specific, actionable complaint — not a generic or cryptic error — when it does
        not match
      emotional: >
        Feel safe that she never has to grant a third-party SaaS elevated schema-
        modification rights on production Postgres; feel confident handing over a
        restricted-privilege connection string; feel in control of exactly what changed
        on her database and when
      social: >
        Elena can show her own security/compliance reviewers that no third-party SaaS
        was ever granted schema-modification rights on production — the same category
        of evidence JOB-09's audit-proof pattern provides for credential egress
    four_forces:
      push: >
        Enterprise Postgres governance policies commonly prohibit granting CREATE/
        ALTER/DROP privileges to any externally-controlled connection string; the
        existing `POST /admin/v1/projects` flow embeds an automatic `sqlx::migrate!`
        call against the exact connection string it stores, which structurally
        requires elevated privileges on that same credential — this blocks onboarding
        for this customer segment today, and the failure mode they hit is an opaque
        Postgres permission error surfaced as a generic `backend_unavailable` 400
      pull: >
        A standalone step Elena runs herself, once, under her own DBA login, removes
        the privilege conflict entirely — she never hands over more than DML rights to
        embyr's stored connection string, and provisioning completes the same day
        instead of stalling on a security-review escalation
      anxiety: >
        "What if the tool I run applies a different schema version than what the
        currently-deployed embyr expects?" — mitigated by requiring the standalone
        tool to apply the identical migration set embyr-server embeds, and by the
        server-side verification step failing loudly with a named, actionable message
        rather than allowing a mismatched database through
      habit: >
        Elena is used to being handed a migration tool (Flyway, golang-migrate,
        sqlx-cli) to run herself, under her own login, as a one-time pre-deployment
        step — a familiar DBA pattern; she does not expect, and would resist, a
        workflow that requires granting a SaaS vendor elevated schema rights
    opportunity_score: 14
    priority: high
    # NOTE (customer-db-onboarding DISCUSS, 2026-08-16): scoped to
    # backend_mode=direct_pg only in this feature's stories — aws_secret/
    # gcp_secret provisioning branches share the identical underlying gap
    # (they also call sqlx::migrate! against the fetched DSN) but are
    # deferred as follow-up scope to keep this feature right-sized. See
    # docs/feature/customer-db-onboarding/feature-delta.md § Out of Scope.
