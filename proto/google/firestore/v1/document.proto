syntax = "proto3";

package google.firestore.v1;

import "google/firestore/v1/common.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.google.firestore.v1";

// A Firestore document.
message Document {
  // The resource name of the document.
  string name = 1;

  // The document's fields.
  map<string, Value> fields = 2;

  // Output only. The time at which the document was created.
  google.protobuf.Timestamp create_time = 3;

  // Output only. The time at which the document was last changed.
  google.protobuf.Timestamp update_time = 4;
}

// A message that can hold any of the supported value types.
message Value {
  oneof value_type {
    // A null value.
    NullValue null_value = 11;

    // A boolean value.
    bool boolean_value = 1;

    // An integer value.
    int64 integer_value = 2;

    // A double value.
    double double_value = 3;

    // A timestamp value.
    google.protobuf.Timestamp timestamp_value = 10;

    // A string value.
    string string_value = 17;

    // A bytes value.
    bytes bytes_value = 18;

    // A reference to a document.
    string reference_value = 5;

    // A geo point value representing a point on the surface of Earth.
    LatLng geo_point_value = 8;

    // An array value.
    ArrayValue array_value = 9;

    // A map value.
    MapValue map_value = 6;
  }
}

// A null value in the Value oneof.
enum NullValue {
  NULL_VALUE = 0;
}

// An array value.
message ArrayValue {
  // Values in the array.
  repeated Value values = 1;
}

// A map value.
message MapValue {
  // The map's fields.
  map<string, Value> fields = 1;
}

// An object representing a latitude/longitude pair.
message LatLng {
  // The latitude in degrees.
  double latitude = 1;

  // The longitude in degrees.
  double longitude = 2;
}

// A write on a document.
message Write {
  oneof operation {
    // A document to write.
    Document update = 1;

    // A document name to delete.
    string delete = 2;

    // Applies a transformation to a document.
    DocumentTransform transform = 6;
  }

  // The fields to update in this write.
  DocumentMask update_mask = 3;

  // The transforms to perform after update.
  repeated DocumentTransform.FieldTransform update_transforms = 7;

  // An optional precondition on the document.
  Precondition current_document = 4;
}

// A transformation of a document.
message DocumentTransform {
  // The name of the document to transform.
  string document = 1;

  // The list of transformations to apply to the fields of the document.
  repeated FieldTransform field_transforms = 2;

  // A transformation of a field of the document.
  message FieldTransform {
    // The path of the field.
    string field_path = 1;

    oneof transform_type {
      // Sets the field to the given server value.
      ServerValue set_to_server_value = 2;

      // Adds the given value to the field's current value.
      Value increment = 3;

      // Sets the field to the maximum of its current value and the given value.
      Value maximum = 4;

      // Sets the field to the minimum of its current value and the given value.
      Value minimum = 5;

      // Append the given elements in order if they are not already present in
      // the current field value.
      ArrayValue append_missing_elements = 6;

      // Remove all of the given elements from the array in the field.
      ArrayValue remove_all_from_array = 7;
    }
  }

  // A value that is calculated by the server.
  enum ServerValue {
    SERVER_VALUE_UNSPECIFIED = 0;
    REQUEST_TIME = 1;
  }
}

// The result of applying a write.
message WriteResult {
  // The last update time of the document after applying the write.
  google.protobuf.Timestamp update_time = 1;

  // The results of applying each [DocumentTransform.FieldTransform][google.firestore.v1.DocumentTransform.FieldTransform].
  repeated Value transform_results = 2;
}

// A Document has been deleted from the Cloud Firestore.
message DocumentDelete {
  // The resource name of the [Document][google.firestore.v1.Document] that was deleted.
  string document = 1;

  // A set of target IDs for targets that previously matched this entity.
  repeated int32 removed_target_ids = 6;

  // The read timestamp at which the delete was observed.
  google.protobuf.Timestamp read_time = 4;
}

// A Document has been removed from the view of the targets.
message DocumentRemove {
  // The resource name of the [Document][google.firestore.v1.Document] that has gone out of view.
  string document = 1;

  // A set of target IDs for targets that previously matched this document.
  repeated int32 removed_target_ids = 2;

  // The read timestamp at which the remove was observed.
  google.protobuf.Timestamp read_time = 4;
}

// A digest of all the documents that match a given target.
message ExistenceFilter {
  // The target ID to which this filter applies.
  int32 target_id = 1;

  // The total count of documents that match [target_id][google.firestore.v1.ExistenceFilter.target_id].
  int32 count = 2;
}
