syntax = "proto3";

package google.firestore.v1;

import "google/firestore/v1/common.proto";
import "google/firestore/v1/document.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option java_package = "com.google.firestore.v1";

// A request for [Firestore.Commit][google.firestore.v1.Firestore.Commit].
message CommitRequest {
  // Required. The database name. In the format:
  // `projects/{project_id}/databases/{database_id}`.
  string database = 1;

  // The writes to apply.
  repeated Write writes = 2;

  // If set, applies all writes in this transaction, and commits it.
  bytes transaction = 3;
}

// The response for [Firestore.Commit][google.firestore.v1.Firestore.Commit].
message CommitResponse {
  // The result of applying the writes.
  repeated WriteResult write_results = 1;

  // The time at which the commit occurred.
  google.protobuf.Timestamp commit_time = 2;
}

// A request for [Firestore.Rollback][google.firestore.v1.Firestore.Rollback].
message RollbackRequest {
  // Required. The database name. In the format:
  // `projects/{project_id}/databases/{database_id}`.
  string database = 1;

  // Required. The transaction to roll back.
  bytes transaction = 2;
}

// A request for [Firestore.BeginTransaction][google.firestore.v1.Firestore.BeginTransaction].
message BeginTransactionRequest {
  // Required. The database name. In the format:
  // `projects/{project_id}/databases/{database_id}`.
  string database = 1;

  // The options for the transaction.
  TransactionOptions options = 2;
}

// The response for [Firestore.BeginTransaction][google.firestore.v1.Firestore.BeginTransaction].
message BeginTransactionResponse {
  // The transaction that was started.
  bytes transaction = 1;
}

// A request for [Firestore.Write][google.firestore.v1.Firestore.Write].
message WriteRequest {
  // Required. The database name. Present on every message (handshake and
  // subsequent), matching real Firestore's own wire shape.
  string database = 1;

  // The ID of the write stream, issued by the first WriteResponse. Empty on
  // the first (handshake) message; must echo the issued stream_id on every
  // subsequent message.
  string stream_id = 2;

  // The writes to apply. Empty on the first (handshake) message — a non-empty
  // `writes` on the handshake message is rejected (AC-01-04).
  repeated Write writes = 3;

  // A token from the most recent WriteResponse, used to ensure ordered
  // request delivery. Empty on the first (handshake) message; must echo the
  // most-recently-issued stream_token on every subsequent message (Slice 03).
  bytes stream_token = 4;
}

// The response for [Firestore.Write][google.firestore.v1.Firestore.Write].
message WriteResponse {
  // The ID of the write stream, issued once at handshake and echoed
  // unchanged on every subsequent response.
  string stream_id = 1;

  // A token to use on the next WriteRequest. Rotates on every response.
  bytes stream_token = 2;

  // The result of applying the writes. Empty on the handshake response (no
  // writes were submitted).
  repeated WriteResult write_results = 3;

  // The time at which the commit occurred. Set on every response, including
  // the handshake response (docs/SPEC.md §Write Stream, step 2).
  google.protobuf.Timestamp commit_time = 4;
}

// A request for [Firestore.BatchWrite][google.firestore.v1.Firestore.BatchWrite].
message BatchWriteRequest {
  // Required. The database name. In the format:
  // `projects/{project_id}/databases/{database_id}`.
  string database = 1;

  // The writes to apply. Unlike `Commit`, this is NOT applied atomically —
  // each write applies (or fails) independently (docs/SPEC.md §BatchWrite).
  repeated Write writes = 2;
}

// The response for [Firestore.BatchWrite][google.firestore.v1.Firestore.BatchWrite].
message BatchWriteResponse {
  // The result of applying each write. Always the same length as the
  // request's own `writes`, positionally aligned. Entry i is always present
  // (an empty WriteResult on failure), never absent.
  repeated WriteResult write_results = 1;

  // The status of applying each write. Always the same length and position
  // as `write_results`. A `Status{code: 0}` (OK) entry means that write
  // succeeded; any other code means it failed. There is no separate
  // top-level RPC error for a per-write failure.
  repeated google.rpc.Status status = 2;
}
