# client-auth-hosted-identity (Slice 01, ADR-036 Decision 2): promoted from
# dev-dependencies -- enable_hosted_identity generates a REAL Ed25519
# signing keypair in PRODUCTION code (embyr's own project-scoped signing
# key), not just test fixtures (mirrors custom-claims' serde_json
# promotion in embyr-core/Cargo.toml).
ed25519-dalek = { workspace = true }
# firestore-tls-support: promoted from dev-dependencies -- load_tls_material
# parses REAL operator-provided PEM cert/key files in PRODUCTION code, not
# just test fixtures (mirrors ed25519-dalek's own documented promotion above).
rustls-pemfile.workspace = true

