[package]
name = "embyr-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# embyr-core is pure domain — NO IO crates allowed.
# Enforced by deny.toml bans.
[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
# custom-claims (ADR-034 § Decision — Claims Representation): first non-dev
# consumer of serde_json in embyr-core. Pure serialization/data-model crate,
# no filesystem/network/async-runtime surface — deny.toml's IO-prohibition
# ban list does not include it (verified against deny.toml directly).
serde_json.workspace = true
chrono.workspace = true
argon2 = { workspace = true, features = ["password-hash"] }
blake3.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }
hkdf.workspace = true
aes-gcm = { workspace = true, features = ["aes"] }
rand_core.workspace = true
sha2.workspace = true
uuid.workspace = true
# client-auth (DDD-CA-8, ADR-024): embyr-core's first-time jsonwebtoken
# consumer. Verified pure-computation (aws_lc_rs EdDSA backend) — no IO,
# deny.toml's IO-prohibition bans list is unaffected (see brief.md §
# Architecture Enforcement — client-auth).
jsonwebtoken = { workspace = true }
# client-auth-hosted-identity (ADR-036 Decision 3): production
# mint_client_identity_token() needs real Ed25519 signing (embyr itself
# mints, not just verifies) — promoted from dev-only (test-token minting)
# to a real dependency. Pure computation, no IO — deny.toml unaffected.
ed25519-dalek = { workspace = true }
base64.workspace = true

[dev-dependencies]
proptest.workspace = true
hmac.workspace = true
