[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }

# gRPC / protobuf
tonic = { version = "0.12", features = ["tls"] }
tonic-web = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP framework
axum = "0.7"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
http = "1"
http-body = "1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }

# Crypto
argon2 = "0.5"
blake3 = "1"
x25519-dalek = "2"
hkdf = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
totp-rs = { version = "5", features = ["otpauth"] }

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"

# Async trait helper (pure proc-macro, no IO)
async-trait = "0.1"

# Utility
lru = "0.12"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.14"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# AWS SDK
aws-config = "1"
aws-sdk-secretsmanager = "1"

# Testing (dev-only)
testcontainers = "0.23"
testcontainers-modules = { version = "0.9", features = ["postgres"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
rcgen = "0.13"
tempfile = "3"
rustls-pemfile = "2"
x509-parser = "0.16"
serial_test = "3"
proptest = "1"

# Internal crates
embyr-proto = { path = "crates/embyr-proto" }
embyr-core = { path = "crates/embyr-core" }
embyr-pg-storage = { path = "crates/embyr-pg-storage" }
