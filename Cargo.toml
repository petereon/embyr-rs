[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }

# gRPC / protobuf
tonic = { version = "0.12", features = ["tls"] }
tonic-web = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP framework
axum = "0.7"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
http = "1"
http-body = "1"
tower = { version = "0.5", features = ["util"] }
bytes = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }

# Crypto
argon2 = "0.5"
blake3 = "1"
x25519-dalek = "2"
hkdf = "0.12"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
totp-rs = { version = "5", features = ["otpauth"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
subtle = "2"
# client-auth (ADR-024): mints real Ed25519-signed test tokens simulating a
# customer's own backend (Trailmark) — not used in any production adapter
# (production verification is jsonwebtoken/aws_lc_rs only, per ADR-024).
ed25519-dalek = { version = "2", features = ["rand_core"] }

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"

# Async trait helper (pure proc-macro, no IO)
async-trait = "0.1"

# Utility
lru = "0.18"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# AWS SDK
# default-features disabled to drop the "rustls" legacy-compat alias, which
# pulls a duplicate old hyper-rustls 0.24/rustls 0.21 TLS stack alongside the
# modern one already pulled in by default-https-client (CVE: rustls-webpki
# 0.101.7 DoS + name-constraint bugs, GHSA advisories on this repo's Cargo.lock).
aws-config = "1"
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Stripe SDK (ADR-021) — embyr-server only; embyr-core never depends on it (IO-prohibition, deny.toml).
# Pinned to the latest published release at implementation time (no non-RC 1.0
# release exists yet on crates.io as of this DISTILL run).
# default-features disabled + rustls-tls-webpki-roots enabled: async-stripe's
# default `default-tls` feature pulls in `hyper-tls`/`tokio-native-tls`,
# neither of which is in deny.toml's tokio `wrappers` allowlist (this
# workspace is rustls-only throughout — matches `reqwest`'s own
# `rustls-tls`+`default-features = false` choice a few lines above).
async-stripe = { version = "1.0.0-rc.8", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-ring", "uuid"] }
# async-stripe 1.0-rc splits per-resource typed request builders out of the
# facade crate into separate companion crates (discovered during step 01-01):
# Customer lives in `-core`, Subscription/usage-records in `-billing`,
# Webhook::construct_event (signature verification, ADR-021's primary
# rationale for choosing a vendor SDK over hand-rolled reqwest) in `-webhook`.
# `async-stripe-core` gates each resource module behind an identically-named,
# opt-in Cargo feature (default-features = false, no `default` feature
# defined) — "customer" and "balance" enable the two typed builders this
# adapter uses (step 01-05: `CreateCustomer`, `RetrieveForMyAccountBalance`).
async-stripe-core = { version = "1.0.0-rc.8", default-features = false, features = ["customer", "balance"] }
# `async-stripe-billing` gates each resource module behind an identically-named
# opt-in feature too (no `default` feature defined) — "subscription" enables
# the typed builders step 01-02 uses (`CreateSubscription`, `UpdateSubscription`,
# `ListSubscription`); `CreateSubscriptionItems`/`UpdateSubscriptionItems` live
# inside the same `subscription` module, no separate `subscription_item`
# feature needed.
# `billing_meter`/`billing_meter_event` added in step 02-01 (US-205): the
# legacy per-subscription-item Usage Records endpoint has no typed builder in
# this crate version (confirmed absent from both `-billing` and `-core`) and
# is unreachable anyway — every US-205 test fixture stays on the Free plan
# (Customer-only, no real Stripe Subscription/subscription-item ever
# created), so Stripe's newer Billing Meter Events API (customer-keyed, no
# subscription required) is the only typed mechanism that fits — also matches
# feature-delta.md's own framing ("usage records attach to the Stripe
# customer").
async-stripe-billing = { version = "1.0.0-rc.8", features = ["subscription", "billing_meter", "billing_meter_event"] }
async-stripe-webhook = "1.0.0-rc.8"

# Testing (dev-only)
testcontainers = "0.23"
testcontainers-modules = { version = "0.9", features = ["postgres"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }
rcgen = "0.13"
tempfile = "3"
rustls-pemfile = "2"
x509-parser = "0.16"
serial_test = "3"
proptest = "1"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Internal crates
embyr-proto = { path = "crates/embyr-proto" }
embyr-core = { path = "crates/embyr-core" }
embyr-pg-storage = { path = "crates/embyr-pg-storage" }
embyr-agent = { path = "crates/embyr-agent" }
