# cargo-deny configuration for embyr-rs workspace.
# Primary purpose: enforce embyr-core IO-prohibition.
# embyr-core is pure domain — no async runtime, DB driver, or HTTP framework allowed.

[graph]
all-features = false

# ---------------------------------------------------------------------------
# Advisories: ignore known issues in pinned dependency versions.
# These advisories are accepted for the initial workspace scaffold.
# ---------------------------------------------------------------------------
[advisories]
ignore = [
    # rustls-pemfile 1.x unmaintained — no safe upgrade available for sqlx 0.7.x dep
    "RUSTSEC-2025-0134",
    # rsa 0.9.10 Marvin Attack (timing sidechannel key recovery) — dev-only,
    # via testcontainers' x509-parser chain (mTLS test fixtures). Never
    # ships in the production binary; not network-observable in CI. No
    # patched rsa release exists yet upstream.
    "RUSTSEC-2023-0071",
    # tokio-tar 0.3.1 PAX header tar-smuggling (CVE-2025-62518) — dev-only,
    # via testcontainers pulling container images in tests. Never ships in
    # the production binary. Crate is archived/unmaintained with no safe
    # upgrade; real fix is testcontainers migrating off it upstream.
    "RUSTSEC-2025-0111",
]

# ---------------------------------------------------------------------------
# Licenses: permissive policy for OSS workspace.
# Workspace crates inherit license = "MIT" from [workspace.package].
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    # webpki-roots (transitive via aws-config's TLS stack) — permissive,
    # data-only license (bundles Mozilla's CA root list), no copyleft terms.
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "allow"
unknown-git = "allow"

# ---------------------------------------------------------------------------
# IO-PROHIBITION: embyr-core MUST NOT directly depend on IO crates.
#
# The `wrappers` list enumerates every crate that is permitted to have the
# banned crate as a DIRECT dependency. embyr-core is intentionally absent
# from each wrapper list — cargo-deny will error if embyr-core gains a
# direct dependency on any of these crates.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "allow"
wildcards = "allow"

deny = [
    # Async runtime — banned from embyr-core
    { name = "tokio", wrappers = [
        "embyr-server",
        "embyr-admin-ui",
        "embyr-agent",
        # embyr-db-prep (customer-db-onboarding, ADR-022) — customer-run
        # standalone binary; IO-permissive scope, same as embyr-agent/embyr-server.
        "embyr-db-prep",
        "embyr-pg-storage",
        "tokio-util",
        "tokio-stream",
        "tokio-tar",
        "tonic",
        "axum",
        "hyper",
        "hyper-util",
        "hyper-timeout",
        "hyper-rustls",
        "hyper-named-pipe",
        "hyperlocal",
        "sqlx-core",
        "sqlx-macros-core",
        "h2",
        "tower",
        "tower-http",
        "reqwest",
        "tokio-rustls",
        "bollard",
        "testcontainers",
        "metrics-exporter-prometheus",
        "aws-config",
        "aws-smithy-async",
        "aws-smithy-http-client",
        "aws-smithy-runtime",
        "aws-smithy-runtime-api",
        "aws-smithy-types",
        # Stripe SDK (ADR-021, card-payments-backend) — embyr-server only.
        "async-stripe",
    ] },

    # gRPC framework — banned from embyr-core
    { name = "tonic", wrappers = [
        "embyr-proto",
        "embyr-server",
        "embyr-agent",
        "tonic-web",
    ] },

    # HTTP framework — banned from embyr-core
    { name = "axum", wrappers = [
        "embyr-server",
        "embyr-admin-ui",
        "tonic",
    ] },

    # Database driver — banned from embyr-core
    { name = "sqlx", wrappers = [
        "embyr-server",
        "embyr-agent",
        # embyr-db-prep (customer-db-onboarding, ADR-022) — applies
        # migrations/customer/ via PostgresBackendAdapter::migrate().
        "embyr-db-prep",
        "embyr-pg-storage",
    ] },

    # Low-level HTTP — banned from embyr-core
    { name = "hyper", wrappers = [
        "embyr-server",
        "axum",
        "hyper-util",
        "hyper-timeout",
        "hyper-rustls",
        "hyper-named-pipe",
        "hyperlocal",
        "tonic",
        "reqwest",
        "bollard",
        "metrics-exporter-prometheus",
        "aws-smithy-http-client",
        # Stripe SDK (ADR-021, card-payments-backend) — embyr-server only.
        "async-stripe",
    ] },
]
