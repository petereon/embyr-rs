# cargo-deny configuration for embyr-rs workspace.
# Primary purpose: enforce embyr-core IO-prohibition.
# embyr-core is pure domain — no async runtime, DB driver, or HTTP framework allowed.

[graph]
all-features = false

# ---------------------------------------------------------------------------
# Advisories: ignore known issues in pinned dependency versions.
# These advisories are accepted for the initial workspace scaffold.
# ---------------------------------------------------------------------------
[advisories]
ignore = [
    # sqlx 0.7.x binary protocol truncation — mitigated at application layer
    "RUSTSEC-2024-0363",
    # rustls-webpki 0.101.x CRL panic — not using CRLs
    "RUSTSEC-2026-0104",
    # rustls-webpki 0.101.x URI name constraints — post-signature-verification only
    "RUSTSEC-2026-0098",
    # rustls-webpki 0.101.x wildcard name constraints — post-signature-verification only
    "RUSTSEC-2026-0099",
    # rustls-pemfile 1.x unmaintained — no safe upgrade available for sqlx 0.7.x dep
    "RUSTSEC-2025-0134",
    # lru 0.12.x IterMut soundness — embyr-server only, not security-critical path
    "RUSTSEC-2026-0002",
    # paste 1.x unmaintained — transitive via sqlx 0.7.x, no safe upgrade
    "RUSTSEC-2024-0436",
]

# ---------------------------------------------------------------------------
# Licenses: permissive policy for OSS workspace.
# Workspace crates inherit license = "MIT" from [workspace.package].
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]

[sources]
unknown-registry = "allow"
unknown-git = "allow"

# ---------------------------------------------------------------------------
# IO-PROHIBITION: embyr-core MUST NOT directly depend on IO crates.
#
# The `wrappers` list enumerates every crate that is permitted to have the
# banned crate as a DIRECT dependency. embyr-core is intentionally absent
# from each wrapper list — cargo-deny will error if embyr-core gains a
# direct dependency on any of these crates.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "allow"
wildcards = "allow"

deny = [
    # Async runtime — banned from embyr-core
    { name = "tokio", wrappers = [
        "embyr-server",
        "embyr-admin",
        "embyr-agent",
        "tokio-util",
        "tokio-stream",
        "tonic",
        "axum",
        "axum-core",
        "hyper",
        "hyper-util",
        "hyper-timeout",
        "sqlx-core",
        "sqlx-macros-core",
        "h2",
        "tower",
        "reqwest",
        "tokio-rustls",
    ] },

    # gRPC framework — banned from embyr-core
    { name = "tonic", wrappers = [
        "embyr-proto",
        "embyr-server",
        "embyr-agent",
    ] },

    # HTTP framework — banned from embyr-core
    { name = "axum", wrappers = [
        "embyr-server",
        "embyr-admin",
        "tonic",
    ] },

    # Database driver — banned from embyr-core
    { name = "sqlx", wrappers = [
        "embyr-server",
        "embyr-admin",
        "embyr-agent",
    ] },

    # Low-level HTTP — banned from embyr-core
    { name = "hyper", wrappers = [
        "embyr-server",
        "embyr-admin",
        "axum",
        "axum-core",
        "hyper-util",
        "hyper-timeout",
        "tonic",
        "reqwest",
        "tower-http",
    ] },
]
